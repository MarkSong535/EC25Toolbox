<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Messages"><link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<title>Messages</title><link rel="stylesheet" href="/assets/style.css"><link rel="stylesheet" href="/assets/layout.css"><link rel="stylesheet" href="/assets/theme.css"><script src="/assets/app.js" defer></script></head>
<body><button id="menu-toggle" class="menu-toggle" aria-label="Open conversations" aria-controls="sidebar" aria-expanded="false"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M4 6H20M4 12H20M4 18H20" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button><button id="sidebar-backdrop" aria-label="Close conversations" tabindex="-1" hidden></button><button id="connection" class="sim-dot offline" title="SIM Status: connecting" aria-label="SIM Status: connecting. Open access logs."></button><main><aside id="sidebar" aria-label="Conversations"><div class="sidebar-controls"><button id="new" class="primary">＋ New message</button></div><label class="search-label" for="search">Find a conversation</label><input id="search" type="search" placeholder="Search number or message" autocomplete="off"><div id="contacts" aria-label="Conversations"></div><button id="older" class="quiet">Load older messages</button><button id="archives-toggle" class="quiet">Archives</button></aside>
<section class="workspace"><div class="conversation-heading"><div><h1 id="title">Messages</h1><p id="subtitle">Choose a conversation, or start a new one.</p></div></div>
<p id="notice" role="status" aria-live="polite"></p><div id="timeline" aria-live="polite"><div class="empty">Select a conversation</div></div>

<section id="audit-panel" hidden><div id="audit-items"></div><button id="audit-older" class="quiet">Load older archives</button></section>
<section id="logins-panel" hidden><p class="log-help">First portal visit per session. Browser/device details are client-reported; times use your local timezone.</p><div id="logins-items"></div><button id="logins-older" class="quiet">Load older logins</button></section>
</section></main></body></html>
